<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HostelDesk AI</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fc;--cd:#fff;--tx:#14163a;--mu:#646b92;--bd:#e2e5f3;--pr:#4338ca;--g:linear-gradient(120deg,#4f46e5,#06b6d4);--sd:#12142e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0d1c;--cd:#161934;--tx:#eef0ff;--mu:#9aa1c9;--bd:#262a4d;--pr:#a5b4fc;--sd:#080915}}
:root[data-theme=dark]{--bg:#0b0d1c;--cd:#161934;--tx:#eef0ff;--mu:#9aa1c9;--bd:#262a4d;--pr:#a5b4fc;--sd:#080915}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Plus Jakarta Sans',Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}h2,h3,h4{margin:.5em 0}:focus-visible{outline:2px solid #06b6d4;outline-offset:2px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 2px 12px #1b1f5c0d;transition:.2s}
.cd:hover{box-shadow:0 8px 24px #1b1f5c1f}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--g);color:#fff;transition:.15s}.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.o{background:none;border:1px solid var(--bd);color:var(--tx)}
.lk{background:none;border:0;padding:6px 2px;cursor:pointer;color:var(--mu);font-weight:600;text-decoration:none;font-size:14px}
.in{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd)}
.w{max-width:1120px;margin:auto;padding:0 18px}.nav{display:flex;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}.sp{flex:1}
.lg{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--g)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:36px 0}
h1{font-size:clamp(34px,5vw,56px);line-height:1.06;margin:0 0 14px;letter-spacing:-.02em}.gt{background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.fl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mu{color:var(--mu)}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.st{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--bd);border-radius:12px;margin:6px 0;opacity:.4;animation:lit 8s infinite}
@keyframes lit{0%,3%{opacity:.4}6%,16%{opacity:1;border-color:#06b6d4;box-shadow:0 0 18px #06b6d455}22%,100%{opacity:.4}}
.pb{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:var(--g);width:0;transition:width 1s}
.sp2{width:14px;height:14px;border:2px solid var(--bd);border-top-color:#06b6d4;border-radius:50%;animation:rt .7s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
.wl{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.mn{padding:20px;min-width:0}
.sb{background:var(--sd);padding:18px 12px;position:sticky;top:0;align-self:start;height:100vh}
.sb a{display:block;padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;color:#aab0dd;margin:2px 0}.sb a.on,.sb a:hover{background:#ffffff18;color:#fff}
.al{background:linear-gradient(120deg,#dc2626,#9f1239);color:#fff;border-radius:16px;padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:12px 0;animation:pl 1.6s infinite}
@keyframes pl{50%{box-shadow:0 0 0 8px #dc262633}}@keyframes up{from{opacity:0;transform:translateY(10px)}}@keyframes dr{to{stroke-dashoffset:0}}
#md{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px;z-index:50}#md.on{display:grid}
.mb{background:var(--cd);border-radius:20px;padding:24px;max-width:540px;width:100%;max-height:90vh;overflow:auto;animation:up .25s}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--cd);border-left:1px solid var(--bd);padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px;overflow:auto;transform:translateX(100%);transition:.3s;z-index:40}#dr.on{transform:none}
#ts{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60}.t{background:#14163a;color:#fff;padding:10px 16px;border-radius:12px;animation:up .25s;box-shadow:0 6px 20px #0005}
#nt{position:absolute;right:0;top:44px;width:min(320px,80vw);display:none;z-index:30}#nt.on{display:block}
@media(max-width:820px){.hero{grid-template-columns:1fr}.wl{grid-template-columns:1fr}.sb{height:auto;position:static;display:flex;overflow-x:auto;gap:4px;padding:10px}.sb a{white-space:nowrap}.sb .nb{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div id="md" onclick="if(event.target==this)mdl()"><div class="mb" id="mb"></div></div><aside id="dr"></aside><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const PN={C:'Critical',H:'High',M:'Medium',L:'Low'},PO={C:0,H:1,M:2,L:3},PC={C:'#dc2626',H:'#c2410c',M:'#b45309',L:'#15803d'},PCN=Object.fromEntries(Object.entries(PN).map(([k,v])=>[v,PC[k]]));
const PD=['Safety hazards, major outages, serious emergencies','Essential services unavailable or affecting many students','Important but not immediately dangerous','Minor inconvenience or non-urgent requests'];
const TEAMS=['Electrical Team','Plumbing Team','Housekeeping','Security','Hostel Supervisor'],ST=['Submitted','Assigned','In Progress','Resolved','Closed'];
const CATS=['Electrical','Plumbing','Water Supply','Internet/Wi-Fi','Cleaning','Furniture','Food/Mess','Security','Room Maintenance','Other'];
const RU=[
[/spark|burning|exposed|shock|short.?circuit|no electricity|smoke|fire/i,'Electrical','C',98,0,'Dispatch electrical maintenance immediately and isolate the affected circuit.','Within 1 hour','a possible electrical safety hazard that could cause injury or property damage'],
[/no (hot )?water|water (supply|is not|not)|without water/i,'Water Supply','H',94,1,'Restore the water supply and inspect the tank and pump.','Within 3 hours','an interruption of an essential hostel service'],
[/leak|tap|pipe|flush|drain|clog|overflow/i,'Plumbing','M',90,1,'Schedule a plumber visit.','Within 24 hours','a repairable fault that is not immediately dangerous'],
[/wi-?fi|internet|router|network/i,'Internet/Wi-Fi','M',91,4,'Check the access point and uplink for the block.','Within 6 hours','a connectivity issue affecting study and communication'],
[/food|mess|dinner|lunch|breakfast|chapati|cockroach/i,'Food/Mess','M',89,4,'Raise it with the mess contractor and inspect the kitchen.','Within 24 hours','a food-quality concern that needs follow-up'],
[/stranger|unknown person|theft|stolen|cctv|harass|unsafe|roaming/i,'Security','H',92,3,'Alert security and review CCTV for the area.','Within 30 minutes','a possible risk to student safety'],
[/fan|light|bulb|socket|switch|tube|electric|extension/i,'Electrical','M',92,0,'Send an electrician during working hours.','Within 24 hours','a fault that is inconvenient but not hazardous'],
[/window|latch|door|paint|wall|ceiling|roof|seep/i,'Room Maintenance','M',87,4,'Schedule a maintenance visit to the room.','Within 48 hours','a room repair that is important but not dangerous'],
[/table|chair|bed|mattress|cupboard|almirah|desk|furniture/i,'Furniture','L',90,4,'Add to the furniture requests list.','Within 3 days','a minor, non-urgent request'],
[/dirty|clean|garbage|dustbin|toilet|washroom|slippery/i,'Cleaning','M',88,2,'Notify housekeeping for a cleaning round.','Within 12 hours','a hygiene issue that needs timely attention'],
[/[\s\S]/,'Other','L',72,4,'Review manually and route to the right team.','Within 3 days','a general request without urgent indicators']];
function cls(t,r=''){const x=RU.find(x=>x[0].test(t)),n=+((t.match(/(\d+)\s*(students|boys|girls|people|residents)/i)||[])[1]||1),b=(r.match(/^([A-D])-?\d/i)||r.match(/block\s*([a-d])/i)||t.match(/block\s*([a-d])/i)||[])[1];let p=x[2];if(n>=10&&p=='M')p='H';return{cat:x[1],pri:p,conf:x[3],team:TEAMS[x[4]],act:x[5],eta:x[6],why:x[7],n,blk:(b||'').toUpperCase()}}
const D=[],ME='Aarav Mehta';let N=1033;
const add=(text,stu,room,st,m,anon)=>{const c={id:'HD-2026-'+(N++),text,stu,room,st,m,anon,...cls(text,room)};D.push(c);return c};
[['Exposed electrical wire hanging near the switchboard','Rohan Verma','C-312','Submitted',12],
['Water supply in Block B bathrooms has stopped since morning, around 18 students are affected','Kabir Singh','B-110','Submitted',84],
['No electricity in the corridor and the emergency lights are not working','Ishaan Gupta','D-021','Assigned',40],
['Ceiling fan is making a loud noise','Neha Arora','A-118','In Progress',300],
['Request for an additional study table in the room','Simran Kaur','A-207','Submitted',1500],
['Wi-Fi has been unavailable in Block A since last night','Tanvi Joshi','A-301','Resolved',720],
['The washroom tap has been leaking continuously','Harsh Vardhan','B-014','In Progress',410],
['Food served at dinner was extremely cold','Anonymous','Mess','Submitted',200],
['Corridor lights are not working on the second floor','Manpreet Singh','C-204','Assigned',960],
['There is a spark coming from the switchboard and the fan suddenly stopped working','Aarav Mehta','B-204','In Progress',180],
['Garbage has not been collected from the floor dustbins for three days','Pooja Nair','C-109','Assigned',2000],
['An unknown person was roaming near the Block D entrance at night','Vikram Rao','D-110','Resolved',1800],
['My bed mattress is torn and very uncomfortable','Aarav Mehta','B-204','Submitted',2500],
['Hot water is not available in the Block B washrooms','Sahil Khan','B-305','Assigned',600],
['The router in the common room keeps disconnecting','Diya Kapoor','Common Area','Resolved',3000],
['The mess ran out of chapatis during dinner','Anonymous','Mess','Closed',4000],
['Washroom floor is slippery and has not been cleaned since morning','Yash Malhotra','A-020','Resolved',1200],
['Window latch is broken and the room does not lock properly','Arjun Reddy','D-205','Assigned',500],
['Water is seeping from the ceiling whenever it rains','Karan Bhatia','C-306','Submitted',260],
['The laundry machine has been out of order for two days','Ananya Das','Laundry','Submitted',1400],
['Sparking observed in the extension board near my study table','Rhea Sharma','A-410','Assigned',90],
['Wi-Fi speed is very slow every evening in Block D','Lakshya Jain','D-312','In Progress',2200],
['Cockroaches spotted in the mess kitchen area','Anonymous','Mess','Assigned',350],
['The tubelight outside my room was flickering','Aarav Mehta','B-204','Resolved',2600]].forEach(a=>add(...a,a[1]=='Anonymous'));
D.forEach((c,i)=>c.conf-=(i+1)%4);
const NT=['🔴 Critical complaint reported in Block C','🟠 3 high-priority complaints awaiting assignment','🟢 Complaint HD-2026-1038 resolved','🤖 AI detected recurring plumbing issues in Block B'];
const S={v:'land',tab:'home',wt:'ov',sel:null,f:{q:'',p:'',s:'',c:'',b:'',o:'ai'}};
const isO=c=>c.st!='Resolved'&&c.st!='Closed',nm=c=>c.anon?'Anonymous':c.stu,tm=m=>m<60?m+' min':m<1440?Math.floor(m/60)+' hr '+m%60+' min':Math.floor(m/1440)+' d',ago=m=>m<1?'Just now':tm(m)+' ago',ar=c=>c.blk?'Block '+c.blk:'Common area';
const pb=p=>`<span class="bd" style="background:${PC[p]}">${PN[p]}</span>`,sb=s=>`<span class="bd" style="background:${{Submitted:'#475569',Assigned:'#7c3aed','In Progress':'#2563eb',Resolved:'#15803d',Closed:'#334155'}[s]}">${s}</span>`;
const empty=(e,t,s)=>`<div class="cd" style="text-align:center;padding:40px"><div style="font-size:40px">${e}</div><b>${t}</b><div class="mu">${s}</div></div>`;
const kp=(l,v,c,x)=>`<div class="cd"><div class="mu" style="font-size:13px">${l}</div><div style="font-size:30px;font-weight:800;color:${c||'var(--tx)'}" data-n="${v}">0</div>${x||''}</div>`;
const spk=(a,c)=>{const m=Math.max(...a);return`<svg viewBox="0 0 100 28" width="100%" height="28"><polyline fill="none" stroke="${c}" stroke-width="2" points="${a.map((v,i)=>i*100/(a.length-1)+','+(26-v/m*24)).join(' ')}"/></svg>`};
const LG='<span class="lg"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l7-4 6 3v14M9 21v-5h4v5M8 11h1M12 11h1"/><path d="M20 3v4M18 5h4"/></svg></span>';
const FL=['Student complaint','Language understanding','Category classification','Priority prediction','AI confidence','Recommended action','Warden resolution'];
const flow=()=>FL.map((x,i)=>`<div class="st" style="animation-delay:${i}s"><b class="gt">${i+1}</b>${x}</div>`).join('');
const LS='The water supply in Block B has stopped since morning and around 20 students are affected.',DM1='There is a strong burning smell from the electrical socket in Room C-312 and I saw a small spark.',DM2=`There is no electricity in Block C and the emergency lights aren't working.`;
function toast(m){const e=document.createElement('div');e.className='t';e.textContent=m;$('#ts').append(e);setTimeout(()=>e.remove(),3200)}
function mdl(h){if(h){$('#mb').innerHTML=h;$('#md').classList.add('on')}else $('#md').classList.remove('on')}
function fill(r){r.querySelectorAll('[data-w]').forEach(e=>setTimeout(()=>e.style.width=e.dataset.w,60))}
const res=c=>`<div style="animation:up .4s"><div class="grid" style="margin:12px 0">${[['Category',c.cat],['Priority',pb(c.pri)],['Urgency',{C:'Immediate attention',H:'Prompt attention',M:'Routine',L:'Low urgency'}[c.pri]],['Affected area',ar(c)],['AI confidence',c.conf+'%']].map(x=>`<div><div class="mu" style="font-size:12px">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div><div class="pb"><i data-w="${c.conf}%"></i></div><p><b>AI reasoning</b><br><span class="mu">Detected a ${c.cat} issue${c.n>1?' affecting '+c.n+' students':''}. Marked ${PN[c.pri]} priority because it points to ${c.why}.</span></p><p><b>Recommended action</b><br><span class="mu">${c.act}</span></p><p><b>Expected response:</b> ${c.eta}</p></div>`;
function an(h,t,cb,room){const c=cls(t,room||''),L=['Understanding complaint…','Detecting keywords…','Identifying category…','Evaluating urgency…','Calculating priority…'];
h.innerHTML=`<div>${L.map(x=>`<div class="fl" style="opacity:.35;margin:6px 0"><i class="sp2"></i>${x}</div>`).join('')}</div><div class="pb"><i></i></div>`;
let i=0;const k=setInterval(()=>{const r=h.children[0].children[i];r.style.opacity=1;r.firstChild.outerHTML='<b style="color:#15803d">✓</b>';h.querySelector('.pb i').style.width=(++i)/L.length*100+'%';
if(i==L.length){clearInterval(k);setTimeout(()=>{h.innerHTML=res(c);fill(h);cb&&cb(c)},450)}},520)}
function la(x){if(x)$('#lt').value=x;const t=$('#lt').value.trim();if(!t)return toast('⚠ Type a complaint first.');an($('#lr'),t)}
function go(v,t){S.v=v;S.sel=null;if(v=='stu')S.tab=t||'home';if(v=='ward')S.wt=t||'ov';draw()}
function draw(){$('#dr').classList.remove('on');$('#app').innerHTML=S.v=='land'?land():S.v=='stu'?stu():ward();after();scrollTo(0,0)}
function rf(){const s=S.sel,y=scrollY;draw();scrollTo(0,y);if(s)op(s)}
function after(){fill(document);document.querySelectorAll('[data-n]').forEach(e=>{const v=+e.dataset.n;let t0;const f=t=>{t0=t0||t;const p=Math.min((t-t0)/700,1);e.textContent=Math.round(v*p);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
if(S.v=='ward'&&!S.tw&&D.some(c=>c.pri=='C'&&c.st=='Submitted')){S.tw=1;setTimeout(()=>toast('⚠ Critical complaint requires immediate attention.'),700)}}
const land=()=>`<div class="w"><nav class="nav">${LG}<b style="font-size:18px">HostelDesk AI</b><span class="sp"></span><a class="lk" href="#top">Home</a><a class="lk" href="#h">How it works</a><a class="lk" href="#ai">AI classification</a><button class="btn o" onclick="go('stu')">Student Portal</button><button class="btn" onclick="go('ward')">Warden Portal</button></nav>
<section id="top" class="hero"><div><p class="mu" style="margin:0 0 10px">AI-powered hostel management</p><h1>Your Hostel Problem.<br><span class="gt">AI Knows What To Do.</span></h1><p class="mu" style="max-width:520px">Report hostel issues in seconds. HostelDesk AI automatically understands, classifies, and prioritizes every complaint so the right problem gets the right attention at the right time.</p><div class="fl"><button class="btn" onclick="go('stu','rep')">Report a Problem</button><button class="btn o" onclick="go('ward')">Open Warden Dashboard</button></div></div>
<div class="cd"><b>“Water has stopped in the Block B bathrooms since morning.”</b>${flow()}</div></section>
<section id="ai" class="cd" style="padding:26px;margin:10px 0 30px;border-color:#06b6d466;box-shadow:0 0 40px #06b6d422"><h2 style="margin-top:0">See AI in Action</h2><p class="mu">Edit the complaint or use the sample, then watch HostelDesk AI work through it.</p><textarea id="lt" class="in" rows="3">${LS}</textarea><div class="fl" style="margin:12px 0"><button class="btn" onclick="la()">Analyze Complaint</button><button class="btn o" onclick="la(DM2)">Try AI Demo</button></div><div id="lr"></div></section>
<section id="h"><h2>How it works</h2><div class="grid">${[['Describe it','Type the problem in your own words. No forms to pick from and no one to chase.'],['AI sorts it','Category, priority and confidence are predicted in seconds.'],['Warden acts','The most urgent issues rise to the top of the queue, ready to assign.']].map(x=>`<div class="cd"><b>${x[0]}</b><div class="mu">${x[1]}</div></div>`).join('')}</div>
<h3 style="margin-top:24px">How AI decides priority</h3><div class="grid">${Object.keys(PN).map((k,i)=>`<div class="cd" style="border-top:4px solid ${PC[k]}"><b>${PN[k]}</b><div class="mu" style="font-size:13px">${PD[i]}</div></div>`).join('')}</div></section>
<footer class="mu" style="padding:34px 0;text-align:center">Smarter Complaints. Faster Resolutions. Better Hostels.</footer></div>`;
const mine=()=>D.filter(c=>c.stu==ME);
const cl=a=>a.length?a.map(c=>`<div class="cd fl" style="margin:8px 0;cursor:pointer" onclick="tl('${c.id}')"><div style="flex:1;min-width:200px"><div class="mu" style="font-size:12px">${c.id} · ${c.cat} · ${ago(c.m)}</div><b>${esc(c.text)}</b></div>${pb(c.pri)}${sb(c.st)}<span class="mu" style="font-size:13px">${c.st=='Submitted'?'Awaiting assignment':c.team}</span></div>`).join(''):empty('📭','No complaints yet','Report a problem and it will show up here.');
function stu(){const T=[['home','Dashboard'],['rep','Report a problem'],['my','My complaints']],m=mine().sort((a,b)=>a.m-b.m),o=m.filter(isO);
const pg=S.tab=='rep'?`<h2>Report a problem</h2><div class="cd"><textarea id="tx" class="in" rows="5" maxlength="500" placeholder="Describe your problem in your own words..." oninput="$('#cc').textContent=this.value.length"></textarea><div class="mu" style="text-align:right;font-size:12px"><span id="cc">0</span>/500</div><div class="grid" style="margin:10px 0"><select id="lc" class="in">${['Hostel Block A','Hostel Block B','Hostel Block C','Hostel Block D','Mess','Common Area','Washroom','Laundry','Other'].map(x=>`<option>${x}</option>`).join('')}</select><input id="rm" class="in" placeholder="Room number (e.g. C-312)"></div><label id="up" class="cd" style="display:block;text-align:center;border-style:dashed;cursor:pointer">📷 Upload a photo of the issue (JPG, PNG)<input type="file" accept="image/png,image/jpeg" hidden onchange="$('#up').firstChild.textContent='✓ '+this.files[0].name"></label><label class="fl" style="margin:12px 0"><input type="checkbox" id="anon"> Submit anonymously</label><div class="fl"><button class="btn" onclick="sub()">Analyze &amp; Submit Complaint</button><button class="btn o" onclick="demo()">Try AI Demo</button></div></div>`
:S.tab=='my'?`<h2>My complaints</h2>${cl(m)}`
:`<h2 style="margin:6px 0 0">Good morning, Aarav 👋</h2><p class="mu" style="margin-top:2px">How can HostelDesk help you today?</p><div class="grid">${kp('Open complaints',o.length)}${kp('In progress',m.filter(c=>c.st=='In Progress').length,'#2563eb')}${kp('Resolved',m.length-o.length,'#15803d')}${kp('High priority',o.filter(c=>PO[c.pri]<2).length,'#dc2626')}</div><div class="cd fl" style="margin:14px 0"><div style="flex:1;min-width:200px"><b>Something wrong in your hostel?</b><div class="mu">Describe it in your own words and the AI does the rest.</div></div><button class="btn" onclick="go('stu','rep')">Report a Problem</button></div><h3>Recent complaints</h3>${cl(m.slice(0,3))}`;
return`<div class="w"><nav class="nav">${LG}<b style="font-size:18px">HostelDesk AI</b><span class="sp"></span>${T.map(t=>`<button class="lk" style="${S.tab==t[0]?'color:var(--tx);border-bottom:2px solid #06b6d4':''}" onclick="go('stu','${t[0]}')">${t[1]}</button>`).join('')}<button class="btn o" onclick="go('ward')">Warden Portal</button></nav><main style="animation:up .3s;padding-bottom:30px">${pg}</main></div>`}
const rmv=()=>$('#rm').value.trim()||$('#lc').value;
function demo(){$('#tx').value=DM1;$('#cc').textContent=DM1.length;$('#rm').value='C-312';$('#lc').value='Hostel Block C';toast('🤖 Demo complaint loaded')}
function sub(){const t=$('#tx').value.trim();if(t.length<10)return toast('⚠ Please describe the problem in a few more words.');
mdl(`<h3 style="margin-top:0">🤖 AI is analyzing your complaint…</h3><div id="ar"></div>`);
an($('#ar'),t,()=>{$('#mb h3').textContent='Complaint analyzed';$('#ar').insertAdjacentHTML('beforeend',`<div class="fl" style="margin-top:14px"><button class="btn" onclick="fin()">Submit Complaint</button><button class="btn o" onclick="mdl()">Edit Complaint</button></div>`);toast('🤖 AI classification completed.')},rmv())}
function fin(){const c=add($('#tx').value.trim(),ME,rmv(),'Submitted',0,$('#anon').checked);mdl();NT.unshift((c.pri=='C'?'🔴 Critical complaint reported in '+ar(c):'📩 New '+PN[c.pri]+' priority complaint: '+c.cat)+' · '+c.id);toast('✓ Complaint submitted successfully.');go('stu','my')}
function tl(id){const c=D.find(x=>x.id==id),n=[2,3,3,5,5][ST.indexOf(c.st)],L=['Complaint submitted','AI classified','Assigned to '+c.team,'Technician working','Issue resolved'];
mdl(`<div class="fl"><b>${c.id}</b>${pb(c.pri)}${sb(c.st)}</div><h3>${esc(c.text)}</h3><div class="mu">${c.cat} · Room ${c.room}</div><div style="margin:16px 0">${L.map((x,i)=>`<div class="fl" style="margin:6px 0;opacity:${i<=n?1:.4}"><b style="color:${i<n?'#15803d':'var(--pr)'}">${i<n?'✓':i==n?'●':'○'}</b>${x}</div>`).join('')}</div><div class="fl"><button class="btn o" onclick="toast('✉️ Message sent to the Warden');mdl()">Message Warden</button>${n<5?`<button class="btn" onclick="setSt('${c.id}','Resolved');mdl()">Mark as Resolved</button>`:''}</div>`)}
function setSt(id,s){D.find(x=>x.id==id).st=s;toast('✓ Status updated to '+s+'.');rf()}
function asg(id,t){const c=D.find(x=>x.id==id);c.team=t;if(c.st=='Submitted')c.st='Assigned';toast('✓ Complaint assigned to '+t+'.');rf()}
const card=c=>`<div class="cd" style="margin:10px 0;border-left:5px solid ${PC[c.pri]};${c.pri=='C'&&c.st=='Submitted'?'animation:pl 1.6s infinite':''}"><div class="fl">${pb(c.pri)}${sb(c.st)}<span class="sp"></span><span class="mu" style="font-size:12px">${c.id}</span></div><b style="font-size:16px;display:block;margin:6px 0">${esc(c.text)}</b><div class="fl mu" style="font-size:13px"><span>📍 ${c.room}</span><span>🏷 ${c.cat}</span><span>🤖 ${c.conf}% confidence</span><span>👥 ${c.n} student${c.n>1?'s':''}</span><span>⏱ ${c.m<1?'< 1 min':tm(c.m)} open</span></div><div class="fl" style="margin-top:10px"><button class="btn o" onclick="op('${c.id}')">View Details</button><button class="btn" onclick="op('${c.id}')">Assign</button></div></div>`;
const tb=a=>`<div class="cd" style="overflow-x:auto;padding:6px"><table style="width:100%;border-collapse:collapse;font-size:13px;min-width:760px"><tr class="mu" style="text-align:left">${['ID','Problem','Student','Room','Category','Priority','Status','Team'].map(h=>`<th style="padding:8px">${h}</th>`).join('')}</tr>${a.map(c=>`<tr onclick="op('${c.id}')" style="cursor:pointer;border-top:1px solid var(--bd)">${[c.id,esc(c.text.slice(0,46)+(c.text.length>46?'…':'')),esc(nm(c)),c.room,c.cat,pb(c.pri),sb(c.st),c.st=='Submitted'?'—':c.team].map(x=>`<td style="padding:8px">${x}</td>`).join('')}</tr>`).join('')}</table></div>`;
function flt(open){const f=S.f,q=f.q.toLowerCase();return D.filter(c=>(!open||isO(c))&&(!f.p||PN[c.pri]==f.p)&&(!f.s||c.st==f.s)&&(!f.c||c.cat==f.c)&&(!f.b||c.blk==f.b)&&(!q||(c.id+' '+nm(c)+' '+c.room+' '+c.cat+' '+c.text).toLowerCase().includes(q))).sort(f.o=='new'?(x,y)=>x.m-y.m:(x,y)=>PO[x.pri]-PO[y.pri]||x.m-y.m)}
function rs(){const a=flt(S.wt=='q'),f=S.f;if(!a.length)return f.q||f.p||f.s||f.c||f.b?empty('🔍','No matching complaints','Try a different keyword or clear a filter.'):empty('🎉',"You're all caught up!",'No pending complaints require your attention.');return S.wt=='q'?a.map(card).join(''):tb(a)}
function sf(){if(S.wt!='q'&&S.wt!='all'){S.wt='q';draw();const i=$('#sq');i.focus();i.setSelectionRange(99,99)}else $('#res').innerHTML=rs()}
const fb=()=>`<div class="fl" style="margin-bottom:12px">${[['p','Priority',Object.values(PN)],['s','Status',ST.slice(0,4)],['c','Category',CATS],['b','Block',['A','B','C','D']]].map(f=>`<select class="in" style="width:auto" onchange="S.f.${f[0]}=this.value;sf()"><option value="">${f[1]}: All</option>${f[2].map(o=>`<option ${S.f[f[0]]==o?'selected':''}>${o}</option>`).join('')}</select>`).join('')}<select class="in" style="width:auto" onchange="S.f.o=this.value;sf()"><option value="ai">Sort by AI priority</option><option value="new" ${S.f.o=='new'?'selected':''}>Newest first</option></select></div><div id="res">${rs()}</div>`;
const INS=[['🔥','Recurring issue detected','Plumbing complaints in Block B increased by 32% this week.','#dc2626',''],['⚠️','Maintenance pattern','7 electrical complaints have been reported in Block C within the last 48 hours.','#c2410c',''],['💡','Recommendation','Consider inspecting the Block C electrical distribution panel.','#4f46e5','<button class="btn" style="margin-top:6px" onclick="toast(`✓ Block C panel inspection scheduled`)">Schedule inspection</button>'],['📊','Resolution insight','Average complaint resolution time has decreased by 18% this month.','#15803d','']];
const bars=(m,col)=>{const mx=Math.max(...Object.values(m),1);return Object.entries(m).map(([k,v])=>`<div class="fl" style="margin:8px 0"><span style="width:62px;font-size:13px">${k}</span><div class="pb" style="flex:1;height:14px"><i data-w="${v/mx*100}%" style="background:${col(k)}"></i></div><b>${v}</b></div>`).join('')};
function ana(){const cn={},bl={A:0,B:0,C:0,D:0},pr={Critical:0,High:0,Medium:0,Low:0};D.forEach(c=>{cn[c.cat]=(cn[c.cat]||0)+1;pr[PN[c.pri]]++;if(c.blk in bl)bl[c.blk]++});
const e=Object.entries(cn),t=D.length,CL=['#4f46e5','#06b6d4','#8b5cf6','#15803d','#b45309','#dc2626','#0ea5e9','#ec4899','#64748b','#14b8a6'],ser=[18,24,21,29,26,31,t],mx=Math.max(...ser)*1.1,pts=ser.map((v,i)=>[15+i*45,105-v/mx*95]);let o=0;
return`<h2 style="margin:0">Hostel Intelligence</h2><p class="mu">Understand recurring problems and improve hostel operations.</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
<div class="cd"><b>Complaints over time</b><svg viewBox="0 0 300 120" width="100%"><polyline fill="none" stroke="#4f46e5" stroke-width="3" pathLength="1" points="${pts.join(' ')}" style="stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.2s forwards"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#06b6d4"/>`).join('')}</svg><div class="mu" style="font-size:12px">Last 7 days</div></div>
<div class="cd"><b>Complaints by category</b><div class="fl"><svg viewBox="0 0 36 36" width="130">${e.map(([k,v],i)=>{const p=v/t*100,s=`<circle cx="18" cy="18" r="15.9155" fill="none" stroke="${CL[i%10]}" stroke-width="4" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-o}" transform="rotate(-90 18 18)"/>`;o+=p;return s}).join('')}<text x="18" y="19.8" text-anchor="middle" font-size="6" font-weight="800" fill="currentColor">${t}</text></svg><div style="font-size:12px">${e.map(([k,v],i)=>`<div><i style="display:inline-block;width:9px;height:9px;border-radius:3px;background:${CL[i%10]}"></i> ${k} ${v}</div>`).join('')}</div></div></div>
<div class="cd"><b>Priority distribution</b>${bars(pr,k=>PCN[k])}</div><div class="cd"><b>Hostel block analysis</b>${bars(Object.fromEntries(Object.entries(bl).map(([k,v])=>['Block '+k,v])),()=>'#4f46e5')}</div></div>`}
function wp(){const t=S.wt,op_=D.filter(isO);
if(t=='q')return`<h2 style="margin:0">AI Priority Queue</h2><p class="mu">Complaints automatically ranked by urgency and impact.</p>${fb()}`;
if(t=='all')return`<h2 style="margin:0">All Complaints</h2><p class="mu">Every complaint, searchable and filterable.</p>${fb()}`;
if(t=='ins')return`<h2 style="margin:0">AI Insights</h2><p class="mu">Patterns the AI spotted across all complaints.</p><div class="cd" style="margin-bottom:14px"><b>How every complaint flows through the AI</b>${flow()}</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${INS.map(i=>`<div class="cd" style="border-top:4px solid ${i[3]}"><div style="font-size:26px">${i[0]}</div><b>${i[1]}</b><p class="mu">${i[2]}</p>${i[4]}</div>`).join('')}</div>`;
if(t=='ana')return ana();
const c=D.filter(x=>x.pri=='C'&&x.st=='Submitted').sort((a,b)=>a.m-b.m)[0];
return`<h2 style="margin:0">Hostel Overview</h2><p class="mu">Here's what needs your attention today.</p>${c?`<div class="al"><span style="font-size:32px">🚨</span><div style="flex:1;min-width:200px"><b style="font-size:18px">Critical Issue Detected</b><div>Possible ${c.cat.toLowerCase()} safety hazard · ${ar(c)} · Room ${c.room} · AI confidence ${c.conf}%</div><b>Immediate attention recommended</b></div><button class="btn" style="background:#fff;color:#b91c1c" onclick="op('${c.id}')">View Complaint</button><button class="btn" style="background:#0007" onclick="asg('${c.id}','${c.team}')">Assign Now</button></div>`:''}
<div class="grid" style="margin:14px 0">${kp('Total complaints',D.length,'',spk([18,24,21,29,26,31,D.length],'#4f46e5')+'<div style="font-size:12px;color:#15803d">+12% this week</div>')}${kp('Pending',op_.length,'#b45309',spk([9,12,10,14,13,15,op_.length],'#b45309'))}${kp('High priority',op_.filter(x=>PO[x.pri]<2).length,'#dc2626',spk([3,5,4,6,5,7,op_.filter(x=>PO[x.pri]<2).length],'#dc2626'))}${kp('Resolved',D.length-op_.length,'#15803d',spk([4,6,5,8,7,9,D.length-op_.length],'#15803d'))}</div>
<h3>⚡ AI Priority Queue</h3><p class="mu">Complaints automatically ranked by urgency and impact.</p>${flt(1).slice(0,5).map(card).join('')}<button class="btn o" onclick="go('ward','q')">View full queue</button>`}
function ward(){const W=[['ov','Overview','📊'],['q','Priority Queue','⚡'],['all','All Complaints','📋'],['ins','AI Insights','🤖'],['ana','Analytics','📈']];
return`<div class="wl"><aside class="sb"><div class="fl nb" style="padding:6px 10px 18px;color:#fff">${LG}<b>HostelDesk AI</b></div>${W.map(n=>`<a class="${S.wt==n[0]?'on':''}" onclick="go('ward','${n[0]}')">${n[2]} ${n[1]}</a>`).join('')}<a onclick="go('stu')">🎓 Student Portal</a></aside><div class="mn"><div class="fl" style="margin-bottom:14px"><input id="sq" class="in" style="flex:1;min-width:140px;max-width:380px" placeholder="Search complaints..." value="${esc(S.f.q)}" oninput="S.f.q=this.value;sf()"><span class="sp"></span><div style="position:relative"><button class="btn o" onclick="$('#nt').classList.toggle('on')">🔔 ${NT.length}</button><div id="nt" class="cd">${NT.map(n=>`<div style="padding:8px 0;border-bottom:1px solid var(--bd)">${n}</div>`).join('')}</div></div><div><b>Rajiv Sharma</b><div class="mu" style="font-size:12px">Hostel Warden</div></div></div><main style="animation:up .3s">${wp()}</main></div></div>`}
function op(id){S.sel=id;const c=D.find(x=>x.id==id);$('#dr').innerHTML=`<div class="fl"><h3 style="margin:0">Complaint ${c.id}</h3><span class="sp"></span><button class="btn o" onclick="S.sel=null;$('#dr').classList.remove('on')" aria-label="Close">✕</button></div><div class="fl" style="margin:10px 0">${pb(c.pri)}${sb(c.st)}</div><div class="mu">Student: <b style="color:var(--tx)">${esc(nm(c))}</b> · Room ${c.room} · ${c.cat}</div><h4>Original complaint</h4><div class="cd" style="font-style:italic">“${esc(c.text)}”</div><h4>AI analysis</h4>${res(c)}<h4>Assignment</h4><div class="fl"><select id="as" class="in" style="flex:1">${TEAMS.map(t=>`<option ${t==c.team?'selected':''}>${t}</option>`).join('')}</select><button class="btn" onclick="asg('${c.id}',$('#as').value)">Assign Complaint</button></div><h4>Status</h4><div class="fl"><select id="ss" class="in" style="flex:1">${ST.map(t=>`<option ${t==c.st?'selected':''}>${t}</option>`).join('')}</select><button class="btn" onclick="setSt('${c.id}',$('#ss').value)">Update Status</button></div>`;$('#dr').classList.add('on');fill($('#dr'))}
draw();
</script></body></html>
